# site properties and page defaults
title: Bo Li Laboratory
subtitle: Gut Remodeling and Regeneration
description: We study the mechanisms of gut remodeling and regeneration across developmental disorders, acquired intestinal injury, and systemic disease states at the Precision Regenerative Medicine Research Centre, Macau University of Science and Technology.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: bo.li@must.edu.mo
  google-scholar: wf4QLyYAAAAJ

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
